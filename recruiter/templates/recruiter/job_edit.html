{% extends 'base.html' %}
{% block content %}
{% load static %}

<div class="job-search-container">
    <div class="page-container">
        <div class="dashboard-section">
            <div class="section-header">
                <h2>Edit Job: {{ template_data.job.title }}</h2>
                <a href="{% url 'recruiter:dashboard' %}" class="btn secondary">Back to Dashboard</a>
            </div>
            
            <form method="post" class="job-form">
                {% csrf_token %}
                
                <div class="form-group">
                    <label for="title">Job Title *</label>
                    <input type="text" name="title" id="title" value="{{ template_data.job.title }}" required>
                </div>
                
                <h3 style="margin-top: 1.5rem; margin-bottom: 1rem; color: #333; font-size: 1.1rem; border-bottom: 2px solid #eee; padding-bottom: 0.5rem;">Address Information</h3>
                
                <div class="form-group">
                    <label for="street_address">Street Address *</label>
                    <input type="text" name="street_address" id="street_address" value="{{ template_data.job.street_address|default:'' }}" placeholder="123 Main Street" required>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="post_code">Post Code (ZIP) *</label>
                        <input type="text" name="post_code" id="post_code" value="{{ template_data.job.post_code|default:'' }}" placeholder="12345" required>
                    </div>
                    <div class="form-group">
                        <label for="city">City *</label>
                        <input type="text" name="city" id="city" value="{{ template_data.job.city|default:'' }}" placeholder="San Francisco" required>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="state">State *</label>
                        <input type="text" name="state" id="state" value="{{ template_data.job.state|default:'' }}" placeholder="CA" required>
                    </div>
                    <div class="form-group">
                        <label for="country">Country</label>
                        <input type="text" name="country" id="country" value="{{ template_data.job.country|default:'USA' }}" readonly style="background-color: #f5f5f5;">
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="salary_min">Minimum Salary *</label>
                        <input type="number" name="salary_min" id="salary_min" value="{{ template_data.job.salary_min }}" required>
                    </div>
                    <div class="form-group">
                        <label for="salary_max">Maximum Salary *</label>
                        <input type="number" name="salary_max" id="salary_max" value="{{ template_data.job.salary_max }}" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="description">Job Description *</label>
                    <textarea name="description" id="description" rows="6" required>{{ template_data.job.description }}</textarea>
                </div>
                
                <div class="form-group">
                    <label for="skills_required">Required Skills</label>
                    <textarea name="skills_required" id="skills_required" rows="3" placeholder="e.g., Python, JavaScript, React, etc.">{{ template_data.job.skills_required }}</textarea>
                </div>
                
                <div class="form-group">
                    <label for="requirements">Requirements</label>
                    <textarea name="requirements" id="requirements" rows="3" placeholder="e.g., 3+ years experience, Bachelor's degree, etc.">{{ template_data.job.requirements }}</textarea>
                </div>
                
                <div class="form-row">
                    <div class="form-group checkbox-group">
                        <label>
                            <input type="checkbox" name="remote" id="remote" {% if template_data.job.remote %}checked{% endif %}>
                            Remote work available
                        </label>
                    </div>
                    <div class="form-group checkbox-group">
                        <label>
                            <input type="checkbox" name="visa_sponsorship" id="visa_sponsorship" {% if template_data.job.visa_sponsorship %}checked{% endif %}>
                            Visa sponsorship available
                        </label>
                    </div>
                </div>
                
                <div class="form-actions">
                    {% if template_data.job.is_draft %}
                        <button type="submit" name="action" value="publish" class="btn primary">Publish Job</button>
                    {% else %}
                        <button type="submit" name="action" value="save" class="btn primary">Save Changes</button>
                        <button type="submit" name="action" value="unpublish" class="btn secondary">Unpublish</button>
                    {% endif %}
                    <a href="{% url 'recruiter:dashboard' %}" class="btn secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>

<style>
.job-form {
    max-width: 800px;
    margin: 0 auto;
}

.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
    margin-bottom: 1rem;
}

.form-group {
    margin-bottom: 1rem;
}

.form-group label {
    display: block;
    margin-bottom: 0.5rem;
    font-weight: 500;
    color: #333;
}

.form-group input,
.form-group textarea {
    width: 100%;
    padding: 0.75rem;
    border: 1px solid #ddd;
    border-radius: 4px;
    font-size: 1rem;
}

.form-group textarea {
    resize: vertical;
    min-height: 100px;
}

.checkbox-group {
    display: flex;
    align-items: center;
    margin-bottom: 0.5rem;
}

.checkbox-group label {
    display: flex;
    align-items: center;
    margin-bottom: 0;
    cursor: pointer;
}

.checkbox-group input[type="checkbox"] {
    width: auto;
    margin-right: 0.5rem;
}

.form-actions {
    display: flex;
    gap: 1rem;
    margin-top: 2rem;
    padding-top: 2rem;
    border-top: 1px solid #eee;
}

.section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 2rem;
}

@media (max-width: 768px) {
    .form-row {
        grid-template-columns: 1fr;
    }
    
    .form-actions {
        flex-direction: column;
    }
}
</style>
{% endblock content %}
