{% extends 'base.html' %}
{% block content %}
{% load static %}

<div class="profile-container">
    <a href="{% url 'recruiter:dashboard' %}" class="edit-icon-button" aria-label="Back to Dashboard">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M19 12H5M12 19l-7-7 7-7" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </a>
    
    <div class="profile-header">
        <div class="profile-name-banner">Create New Job Posting</div>
    </div>
    
    <form method="post" class="profile-content">
        {% csrf_token %}
        
        <div class="info-blocks-container">
            <!-- Job Information -->
            <div class="info-block">
                <div class="info-block-header">Job Information</div>
                <div class="info-block-item">
                    <label class="info-label">Job Title *</label>
                    <input type="text" name="title" id="title" class="info-input" placeholder="e.g., Software Engineer, Product Manager" required>
                </div>
                <div class="info-block-item">
                    <label class="info-label">Job Description *</label>
                    <textarea name="description" id="description" class="info-textarea" rows="6" placeholder="Describe the role, responsibilities, and what makes this opportunity exciting..." required></textarea>
                </div>
                <div class="info-block-item">
                    <label class="info-label">Required Skills</label>
                    <textarea name="skills_required" id="skills_required" class="info-textarea" rows="3" placeholder="e.g., Python, JavaScript, React, Django, AWS, etc."></textarea>
                </div>
                <div class="info-block-item">
                    <label class="info-label">Requirements</label>
                    <textarea name="requirements" id="requirements" class="info-textarea" rows="3" placeholder="e.g., 3+ years experience, Bachelor's degree, etc."></textarea>
                </div>
            </div>
            
            <!-- Location Information -->
            <div class="info-block">
                <div class="info-block-header">Location Information</div>
                <div class="info-block-item">
                    <label class="info-label">Street Address *</label>
                    <input type="text" name="street_address" id="street_address" class="info-input" placeholder="123 Main Street" required>
                </div>
                <div class="info-block-item">
                    <label class="info-label">City *</label>
                    <input type="text" name="city" id="city" class="info-input" placeholder="San Francisco" required>
                </div>
                <div class="info-block-item">
                    <label class="info-label">State *</label>
                    <input type="text" name="state" id="state" class="info-input" placeholder="CA" required>
                </div>
                <div class="info-block-item">
                    <label class="info-label">Post Code (ZIP) *</label>
                    <input type="text" name="post_code" id="post_code" class="info-input" placeholder="12345" required>
                </div>
                <div class="info-block-item">
                    <label class="info-label">Country</label>
                    <input type="text" name="country" id="country" class="info-input" value="USA" readonly>
                </div>
            </div>
        </div>
        
        <!-- Salary Information and Additional Options -->
        <div class="info-blocks-container" style="margin-top: 2rem;">
            <!-- Salary Information -->
            <div class="info-block">
                <div class="info-block-header">Salary Information</div>
                <div class="info-block-item">
                    <label class="info-label">Minimum Salary *</label>
                    <input type="number" name="salary_min" id="salary_min" class="info-input" placeholder="e.g., 80000" required>
                </div>
                <div class="info-block-item">
                    <label class="info-label">Maximum Salary *</label>
                    <input type="number" name="salary_max" id="salary_max" class="info-input" placeholder="e.g., 120000" required>
                </div>
            </div>
            
            <!-- Additional Options -->
            <div class="info-block">
                <div class="info-block-header">Additional Options</div>
                <div class="info-block-item">
                    <label class="checkbox-label">
                        <input type="checkbox" name="remote" id="remote" class="checkbox-input">
                        <span class="checkbox-text">Remote work available</span>
                    </label>
                </div>
                <div class="info-block-item">
                    <label class="checkbox-label">
                        <input type="checkbox" name="visa_sponsorship" id="visa_sponsorship" class="checkbox-input">
                        <span class="checkbox-text">Visa sponsorship available</span>
                    </label>
                </div>
            </div>
        </div>
        
        <!-- Form Actions -->
        <div class="form-actions" style="margin-top: 2rem; display: flex; gap: 1rem; justify-content: center; max-width: 1000px;">
            <button type="submit" name="action" value="publish" class="submit-btn">Publish Job</button>
            <a href="{% url 'recruiter:dashboard' %}" class="cancel-btn">Cancel</a>
        </div>
    </form>
</div>

<style>
.profile-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    padding: 2rem 1rem;
    min-height: 100vh;
}

.edit-icon-button {
    position: absolute;
    top: 1rem;
    right: 2rem;
    background-color: rgb(33, 128, 116);
    color: white;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
    text-decoration: none;
    cursor: pointer;
    z-index: 10;
    transition: opacity 0.2s;
}

.edit-icon-button:hover {
    opacity: 0.9;
}

.edit-icon-button svg {
    width: 20px;
    height: 20px;
}

.profile-header {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.profile-name-banner {
    background-color: rgb(33, 128, 116);
    color: white;
    font-size: 24px;
    font-weight: 500;
    padding: 5px 20px;
    border-radius: 9999px;
    text-align: center;
    margin-top: 0.8rem;
    display: inline-block;
    width: fit-content;
}

.profile-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: 1400px;
    margin-top: 2rem;
}

.info-blocks-container {
    display: flex;
    flex-direction: row;
    gap: 2rem;
    width: 100%;
    align-items: flex-start;
}

.info-block {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    background-color: rgba(33, 128, 116, 0.11);
    border-radius: 19px;
    padding: 1rem 1.5rem 1rem 1.5rem;
    margin-bottom: 1rem;
    flex: 1;
    max-width: 1000px;
}

.info-block-header {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 0.6rem;
}

.info-block-item {
    font-size: 18px;
    margin-bottom: 1rem;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 0.2rem;
}

.info-label {
    font-weight: 500;
}

.info-input,
.info-textarea {
    font-size: 18px;
    font-weight: 400;
    padding: 0.5rem;
    border: 1px solid rgba(33, 128, 116, 0.3);
    border-radius: 8px;
    background-color: white;
    font-family: inherit;
    width: 100%;
    box-sizing: border-box;
}

.info-input:focus,
.info-textarea:focus {
    outline: none;
    border-color: rgb(33, 128, 116);
    box-shadow: 0 0 0 2px rgba(33, 128, 116, 0.1);
}

.info-textarea {
    min-height: 80px;
    resize: vertical;
}

.info-input:disabled,
.info-input[readonly] {
    background-color: #f5f5f5;
    cursor: not-allowed;
}

.checkbox-label {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    cursor: pointer;
    font-weight: 400;
}

.checkbox-input {
    width: 20px;
    height: 20px;
    cursor: pointer;
    accent-color: rgb(33, 128, 116);
}

.checkbox-text {
    font-size: 18px;
}

.form-actions {
    display: flex;
    gap: 1rem;
    justify-content: center;
    flex-wrap: wrap;
}

.submit-btn,
.cancel-btn {
    padding: 10px 30px;
    border: none;
    border-radius: 9999px;
    font-size: 18px;
    font-weight: 500;
    cursor: pointer;
    transition: opacity 0.2s;
    text-decoration: none;
    display: inline-block;
    text-align: center;
}

.submit-btn {
    background-color: rgb(33, 128, 116);
    color: white;
}

.submit-btn:hover {
    opacity: 0.9;
}

.cancel-btn {
    background-color: transparent;
    color: #666;
    border: 1px solid #ddd;
}

.cancel-btn:hover {
    opacity: 0.9;
    background-color: #f5f5f5;
}

@media (max-width: 1024px) {
    .info-blocks-container {
        flex-direction: column;
    }
    
    .info-block {
        max-width: 100%;
    }
}

@media (max-width: 768px) {
    .profile-container {
        padding: 1rem 0.5rem;
    }
    
    .edit-icon-button {
        top: 0.5rem;
        right: 1rem;
    }
    
    .form-actions {
        flex-direction: column;
        width: 100%;
    }
    
    .submit-btn,
    .cancel-btn {
        width: 100%;
    }
}
</style>

{% endblock content %}
