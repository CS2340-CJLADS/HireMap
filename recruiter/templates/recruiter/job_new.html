{% extends 'base.html' %}
{% block content %}
{% load static %}

<div class="job-creation-container">
    <div class="page-container">
        <div class="job-creation-card">
            <div class="card-header">
                <h1>Create New Job Posting</h1>
                <p class="card-subtitle">Fill out the details below to post your job opening</p>
            </div>
            
            <form method="post" class="job-creation-form">
                {% csrf_token %}
                
                <div class="form-group">
                    <label for="title">Job Title *</label>
                    <input type="text" name="title" id="title" placeholder="e.g., Software Engineer, Product Manager, Data Scientist" required>
                </div>
                
                <div class="form-group">
                    <label for="location">Location *</label>
                    <input type="text" name="location" id="location" placeholder="e.g., San Francisco, CA or Remote" required>
                </div>
                
                <div class="form-group">
                    <label for="salary_min">Minimum Salary *</label>
                    <input type="number" name="salary_min" id="salary_min" placeholder="e.g., 80000" required>
                </div>
                
                <div class="form-group">
                    <label for="salary_max">Maximum Salary *</label>
                    <input type="number" name="salary_max" id="salary_max" placeholder="e.g., 120000" required>
                </div>
                
                <div class="form-group">
                    <label for="description">Job Description *</label>
                    <textarea name="description" id="description" rows="6" placeholder="Describe the role, responsibilities, and what makes this opportunity exciting..." required></textarea>
                </div>
                
                <div class="form-group">
                    <label for="skills_required">Required Skills</label>
                    <textarea name="skills_required" id="skills_required" rows="3" placeholder="e.g., Python, JavaScript, React, Django, AWS, etc."></textarea>
                </div>
                
                <div class="form-group">
                    <label for="requirements">Requirements</label>
                    <textarea name="requirements" id="requirements" rows="3" placeholder="e.g., 3+ years experience, Bachelor's degree, etc."></textarea>
                </div>
                
                <div class="checkbox-section">
                    <div class="checkbox-group">
                        <label class="checkbox-label">
                            <input type="checkbox" name="remote" id="remote">
                            <span class="checkmark"></span>
                            Remote work available
                        </label>
                    </div>
                    
                    <div class="checkbox-group">
                        <label class="checkbox-label">
                            <input type="checkbox" name="visa_sponsorship" id="visa_sponsorship">
                            <span class="checkmark"></span>
                            Visa sponsorship available
                        </label>
                    </div>
                </div>
                
                <div class="form-actions">
                    <button type="submit" name="action" value="publish" class="btn-primary">Publish Job</button>
                    <button type="submit" name="action" value="draft" class="btn-secondary">Save as Draft</button>
                    <a href="{% url 'recruiter:dashboard' %}" class="btn-cancel">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>

<style>
/* Job Creation Page Styles */
.job-creation-container {
    min-height: 100vh;
    background: linear-gradient(135deg, rgba(19, 227, 178, 0.05) 0%, rgba(101, 243, 243, 0.05) 100%);
    padding: 2rem 0;
}

.page-container {
    max-width: 600px;
    margin: 0 auto;
    padding: 0 1rem;
}

.job-creation-card {
    background: white;
    border-radius: 20px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    border: 1px solid rgba(19, 227, 178, 0.1);
    overflow: hidden;
}

.card-header {
    background: linear-gradient(135deg, rgba(19, 227, 178, 0.08) 0%, rgba(101, 243, 243, 0.08) 100%);
    border-bottom: 1px solid rgba(19, 227, 178, 0.1);
    padding: 2rem;
    text-align: center;
}

.card-header h1 {
    margin: 0 0 0.5rem 0;
    font-size: 28px;
    font-weight: 600;
    color: #333;
}

.card-subtitle {
    margin: 0;
    color: #666;
    font-size: 16px;
}

.job-creation-form {
    padding: 2rem;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
}

.form-group {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
}

.form-group label {
    font-weight: 600;
    color: #333;
    font-size: 16px;
}

.form-group input,
.form-group textarea {
    padding: 1rem;
    border: 2px solid #e9ecef;
    border-radius: 12px;
    font-size: 16px;
    background: #f8f9fa;
    transition: all 0.3s ease;
}

.form-group input:focus,
.form-group textarea:focus {
    outline: none;
    border-color: #13E3B2;
    background: white;
    box-shadow: 0 0 0 3px rgba(19, 227, 178, 0.1);
}

.form-group textarea {
    resize: vertical;
    min-height: 120px;
    font-family: inherit;
}

.checkbox-section {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    padding: 1rem;
    background: linear-gradient(135deg, rgba(19, 227, 178, 0.05) 0%, rgba(101, 243, 243, 0.05) 100%);
    border-radius: 12px;
    border: 1px solid rgba(19, 227, 178, 0.1);
}

.checkbox-group {
    display: flex;
    align-items: center;
}

.checkbox-label {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    cursor: pointer;
    font-weight: 500;
    color: #333;
    font-size: 16px;
}

.checkbox-label input[type="checkbox"] {
    display: none;
}

.checkmark {
    width: 20px;
    height: 20px;
    border: 2px solid #ddd;
    border-radius: 6px;
    background: white;
    position: relative;
    transition: all 0.3s ease;
}

.checkbox-label input[type="checkbox"]:checked + .checkmark {
    background: #13E3B2;
    border-color: #13E3B2;
}

.checkbox-label input[type="checkbox"]:checked + .checkmark::after {
    content: '✓';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: white;
    font-weight: bold;
    font-size: 12px;
}

.form-actions {
    display: flex;
    gap: 1rem;
    margin-top: 1rem;
    padding-top: 2rem;
    border-top: 1px solid #e9ecef;
}

.btn-primary {
    background: #218074;
    color: white;
    border: none;
    border-radius: 50px;
    padding: 1rem 2rem;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    flex: 1;
}

.btn-primary:hover {
    background: #1a6b5e;
    transform: translateY(-1px);
}

.btn-secondary {
    background: #6c757d;
    color: white;
    border: none;
    border-radius: 50px;
    padding: 1rem 2rem;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    flex: 1;
}

.btn-secondary:hover {
    background: #5a6268;
    transform: translateY(-1px);
}

.btn-cancel {
    background: transparent;
    color: #6c757d;
    border: 2px solid #6c757d;
    border-radius: 50px;
    padding: 1rem 2rem;
    font-size: 16px;
    font-weight: 600;
    text-decoration: none;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s ease;
    flex: 1;
}

.btn-cancel:hover {
    background: #6c757d;
    color: white;
    transform: translateY(-1px);
}

@media (max-width: 768px) {
    .page-container {
        padding: 0 0.5rem;
    }
    
    .card-header {
        padding: 1.5rem;
    }
    
    .card-header h1 {
        font-size: 24px;
    }
    
    .job-creation-form {
        padding: 1.5rem;
        gap: 1rem;
    }
    
    .form-actions {
        flex-direction: column;
    }
    
    .checkbox-section {
        padding: 0.75rem;
    }
}
</style>

{% endblock content %}
