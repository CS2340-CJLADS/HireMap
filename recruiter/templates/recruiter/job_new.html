{% extends 'base.html' %}
{% block content %}
{% load static %}

<div class="job-search-container">
    <div class="page-container">
        <div class="dashboard-section">
            <div class="section-header">
                <h2>Post New Job</h2>
                <a href="{% url 'recruiter:jobs' %}" class="btn secondary">Back to Jobs</a>
            </div>
            
            <form method="post" class="job-form">
                {% csrf_token %}
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="title">Job Title *</label>
                        <input type="text" name="title" id="title" placeholder="e.g., Software Engineer, Product Manager, Data Scientist" required>
                    </div>
                    <div class="form-group">
                        <label for="location">Location *</label>
                        <input type="text" name="location" id="location" placeholder="e.g., San Francisco, CA or Remote" required>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="salary_min">Minimum Salary *</label>
                        <input type="number" name="salary_min" id="salary_min" required>
                    </div>
                    <div class="form-group">
                        <label for="salary_max">Maximum Salary *</label>
                        <input type="number" name="salary_max" id="salary_max" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="description">Job Description *</label>
                    <textarea name="description" id="description" rows="6" required></textarea>
                </div>
                
                <div class="form-group">
                    <label for="skills_required">Required Skills</label>
                    <textarea name="skills_required" id="skills_required" rows="3" placeholder="e.g., Python, JavaScript, React, Django, AWS, etc."></textarea>
                </div>
                
                <div class="form-group">
                    <label for="requirements">Requirements</label>
                    <textarea name="requirements" id="requirements" rows="3" placeholder="e.g., 3+ years experience, Bachelor's degree, etc."></textarea>
                </div>
                
                <div class="form-row">
                    <div class="form-group checkbox-group">
                        <label>
                            <input type="checkbox" name="remote" id="remote">
                            Remote work available
                        </label>
                    </div>
                    <div class="form-group checkbox-group">
                        <label>
                            <input type="checkbox" name="visa_sponsorship" id="visa_sponsorship">
                            Visa sponsorship available
                        </label>
                    </div>
                </div>
                
                <div class="form-actions">
                    <button type="submit" name="action" value="publish" class="btn primary">Publish Job</button>
                    <button type="submit" name="action" value="draft" class="btn secondary">Save as Draft</button>
                    <a href="{% url 'recruiter:jobs' %}" class="btn secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>

<style>
.job-form {
    max-width: 800px;
    margin: 0 auto;
}

.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
    margin-bottom: 1rem;
}

.form-group {
    margin-bottom: 1rem;
}

.form-group label {
    display: block;
    margin-bottom: 0.5rem;
    font-weight: 500;
    color: #333;
}

.form-group input,
.form-group textarea {
    width: 100%;
    padding: 0.75rem;
    border: 1px solid #ddd;
    border-radius: 4px;
    font-size: 1rem;
}

.form-group textarea {
    resize: vertical;
    min-height: 100px;
}

.checkbox-group {
    display: flex;
    align-items: center;
    margin-bottom: 0.5rem;
}

.checkbox-group label {
    display: flex;
    align-items: center;
    margin-bottom: 0;
    cursor: pointer;
}

.checkbox-group input[type="checkbox"] {
    width: auto;
    margin-right: 0.5rem;
}

.form-actions {
    display: flex;
    gap: 1rem;
    margin-top: 2rem;
    padding-top: 2rem;
    border-top: 1px solid #eee;
}

.section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 2rem;
}

@media (max-width: 768px) {
    .form-row {
        grid-template-columns: 1fr;
    }
    
    .form-actions {
        flex-direction: column;
    }
}

</style>

{% endblock content %}
