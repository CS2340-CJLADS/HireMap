{% extends 'base.html' %}
{% block content %}
{% load static %}
<link rel="stylesheet" type="text/css" href="{% static 'css/job_search_dashboard.css' %}">

<div class="job-search-container">
    <!-- Navigation Bar -->
    <nav class="main-nav">
        <div class="nav-content">
            <div class="nav-brand">
                <h2>HireMap</h2>
            </div>
            <div class="nav-links">
                <a href="{% url 'seeker:dashboard' %}" class="nav-link">Jobs</a>
                <a href="{% url 'seeker:applications' %}" class="nav-link">My Applications</a>
                <a href="{% url 'seeker:profile' %}" class="nav-link">My Profile</a>
                <a href="{% url 'seeker:saved_jobs' %}" class="nav-link active">Saved Jobs</a>
                <a href="{% url 'accounts:accounts.logout' %}" class="nav-link">Logout</a>
            </div>
        </div>
    </nav>

    <div class="page-container">
        <div class="dashboard-section">
            <h2>Saved Jobs</h2>
            <p>Jobs you've saved for later review will appear here.</p>
            <div class="no-applications">
                <p>No saved jobs yet. Start browsing jobs to save your favorites!</p>
                <a href="{% url 'seeker:dashboard' %}" class="btn">Browse Jobs</a>
            </div>
        </div>
    </div>
</div>

{% endblock content %}
