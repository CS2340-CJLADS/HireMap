{% extends 'base.html' %}
{% block content %}
{% load static %}
<link rel="stylesheet" type="text/css" href="{% static 'css/style.css' %}">
<style>
.auth-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
  padding: 2rem 1rem;
  min-height: 100vh;
}

.auth-header {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.auth-name-banner {
  background-color: rgb(33, 128, 116);
  color: white;
  font-size: 24px;
  font-weight: 500;
  padding: 5px 20px;
  border-radius: 9999px;
  text-align: center;
  margin-top: 0.8rem;
  display: inline-block;
  width: fit-content;
}

.auth-subtitle {
  color: #666;
  text-align: center;
  margin: 1rem 0 0 0;
  font-size: 18px;
}

.auth-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 500px;
  margin-top: 2rem;
}

.auth-form-group {
  margin-bottom: 1.5rem;
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.auth-label {
  font-size: 18px;
  font-weight: 500;
  color: #000;
}

.auth-input {
  font-size: 18px;
  font-weight: 400;
  padding: 0.75rem;
  border: 1px solid rgba(33, 128, 116, 0.3);
  border-radius: 8px;
  background-color: white;
  font-family: inherit;
  width: 100%;
  box-sizing: border-box;
  transition: all 0.2s;
}

.auth-input:focus {
  outline: none;
  border-color: rgb(33, 128, 116);
  box-shadow: 0 0 0 2px rgba(33, 128, 116, 0.1);
}

.auth-error {
  background: #fef2f2;
  border: 1px solid #fecaca;
  color: #991b1b;
  padding: 0.75rem;
  border-radius: 8px;
  margin-bottom: 1.5rem;
  font-size: 16px;
  width: 100%;
}

.auth-button {
  width: 100%;
  padding: 10px 30px;
  background-color: rgb(33, 128, 116);
  color: white;
  border: none;
  border-radius: 9999px;
  font-size: 18px;
  font-weight: 500;
  cursor: pointer;
  transition: opacity 0.2s;
  margin-bottom: 1rem;
}

.auth-button:hover {
  opacity: 0.9;
}

.auth-button-secondary {
  width: 100%;
  padding: 10px 30px;
  background-color: rgba(33, 128, 116, 0.2);
  color: rgb(33, 128, 116);
  border: none;
  border-radius: 9999px;
  font-size: 18px;
  font-weight: 500;
  cursor: pointer;
  transition: opacity 0.2s;
  text-decoration: none;
  display: block;
  text-align: center;
  box-sizing: border-box;
  margin-bottom: 1rem;
}

.auth-button-secondary:hover {
  opacity: 0.9;
}

.auth-link {
  display: block;
  text-align: center;
  margin-top: 1rem;
  color: #666;
  text-decoration: none;
  font-size: 16px;
  transition: color 0.2s;
}

.auth-link:hover {
  color: rgb(33, 128, 116);
}

@media (max-width: 768px) {
  .auth-container {
    padding: 1rem 0.5rem;
  }
  
  .auth-name-banner {
    font-size: 20px;
    padding: 5px 15px;
  }
  
  .auth-subtitle {
    font-size: 16px;
  }
}
</style>

<div class="auth-container">
  <div class="auth-header">
    <div class="auth-name-banner">Welcome Back</div>
    <p class="auth-subtitle">Sign in to your account</p>
  </div>
  
  <div class="auth-card">
    {% if template_data.error %}
    <div class="auth-error">
      {{ template_data.error }}
    </div>
    {% endif %}
    
    <form method="post" style="width: 100%;">
      {% csrf_token %}
      
      <div class="auth-form-group">
        <label class="auth-label">Email</label>
        <input type="email" name="email" class="auth-input" placeholder="your.email@example.com" required>
      </div>
      
      <div class="auth-form-group">
        <label class="auth-label">Password</label>
        <input type="password" name="password" class="auth-input" placeholder="Enter your password" required>
      </div>
      
      <button type="submit" class="auth-button">Log In</button>
      <a href="{% url 'accounts:signup' %}" class="auth-button-secondary">Create Account</a>
      
      <a href="{% url 'home:index' %}" class="auth-link">← Back to Home</a>
    </form>
  </div>
</div>
{% endblock content %}
