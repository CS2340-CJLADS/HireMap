{% extends 'base.html' %}
{% block content %}
{% load static %}
<link rel="stylesheet" type="text/css" href="{% static 'css/style.css' %}">
<div class="container">
  <div class="hero">
    <h1>Welcome Back</h1>
    <p class="lede muted">Sign in to your account to continue your job search.</p>
  </div>

  <section class="section">
    <div class="card" style="max-width: 400px; margin: 0 auto;">
      <form class="form" method="post">
        {% csrf_token %}
        {% if template_data.error %}
        <div style="background: #fee2e2; border: 1px solid #ef4444; color: #dc2626; padding: 0.75rem; border-radius: 6px; margin-bottom: 1rem;">
          {{ template_data.error }}
        </div>
        {% endif %}
        <div class="form-group">
          <label class="label">Email</label>
          <input type="email" name="email" placeholder="Enter your email" required>
        </div>
        
        <div class="form-group">
          <label class="label">Password</label>
          <input type="password" name="password" placeholder="Enter your password" required>
        </div>
        
        <div class="form-actions">
          <button type="submit" class="btn">Log In</button>
          <a href="{% url 'accounts:accounts.signup' %}" class="btn secondary">Sign Up</a>
        </div>
        
        <div style="text-align: center; margin-top: 1rem;">
          <a href="/" class="link-back">← Back to Home</a>
        </div>
      </form>
    </div>
  </section>
</div>
{% endblock content %}
