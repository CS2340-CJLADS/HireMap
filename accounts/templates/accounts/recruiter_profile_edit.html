{% extends 'base.html' %}
{% block content %}
{% load static %}

<div class="profile-container">
    <a href="{% url 'recruiter:profile' %}" class="edit-icon-button" aria-label="Back to Profile">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M19 12H5M12 19l-7-7 7-7" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </a>
    
    <div class="profile-header">
        <div class="profile-name-banner">Edit Profile</div>
    </div>
    
    <form method="post" class="profile-content">
        {% csrf_token %}
        
        <div class="info-blocks-container">
            <!-- Contact Information -->
            <div class="info-block">
                <div class="info-block-header">Contact Information</div>
                <div class="info-block-item">
                    <label class="info-label">First Name:</label>
                    <input type="text" name="first_name" class="info-input" value="{{ template_data.recruiter.first_name }}" required>
                </div>
                <div class="info-block-item">
                    <label class="info-label">Last Name:</label>
                    <input type="text" name="last_name" class="info-input" value="{{ template_data.recruiter.last_name }}" required>
                </div>
                <div class="info-block-item">
                    <label class="info-label">Email:</label>
                    <input type="text" class="info-input" value="{{ template_data.recruiter.user.username }}" disabled>
                </div>
                <div class="info-block-item">
                    <label class="info-label">Company:</label>
                    <input type="text" name="company_name" class="info-input" value="{{ template_data.recruiter.company_name|default:'' }}" placeholder="Not provided">
                </div>
            </div>
        </div>
        
        <!-- Form Actions -->
        <div class="form-actions">
            <button type="submit" class="submit-button">Save Changes</button>
            <a href="{% url 'recruiter:profile' %}" class="cancel-button">Cancel</a>
        </div>
    </form>
</div>

<style>
.profile-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
}

.edit-icon-button {
    position: absolute;
    top: 1rem;
    right: 2rem;
    background-color: rgb(33, 128, 116);
    color: white;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
    text-decoration: none;
    cursor: pointer;
    z-index: 10;
    transition: opacity 0.2s;
}

.edit-icon-button:hover {
    opacity: 0.9;
}

.edit-icon-button svg {
    width: 20px;
    height: 20px;
}

.profile-header {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.profile-name-banner {
    background-color: rgb(33, 128, 116);
    color: white;
    font-size: 24px;
    font-weight: 500;
    padding: 5px 20px;
    border-radius: 9999px;
    text-align: center;
    margin-top: 0.8rem;
    display: inline-block;
    width: fit-content;
}

.profile-content {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    margin-top: 2rem;
    padding: 0 1rem;
    min-width: 600px;
}

.info-blocks-container {
    display: flex;
    flex-direction: row;
    gap: 1rem;
    width: 100%;
    align-items: flex-start;
}

.info-block {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    background-color: rgba(33, 128, 116, 0.11);
    border-radius: 19px;
    flex: 1;
    padding: 1rem 1.5rem 1rem 1.5rem;
    margin-left: 1rem;
    width: 96.5%;
}

.info-block-header {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: .6rem;
}

.info-block-item {
    font-size: 18px;
    margin-bottom: 1rem;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 0.2rem;
}

.info-label {
    font-weight: 500;
}

.info-input,
.info-textarea,
.info-select {
    font-size: 18px;
    font-weight: 400;
    padding: 0.5rem;
    border: 1px solid rgba(33, 128, 116, 0.3);
    border-radius: 8px;
    background-color: white;
    font-family: inherit;
    width: 100%;
}

.info-input:focus,
.info-textarea:focus,
.info-select:focus {
    outline: none;
    border-color: rgb(33, 128, 116);
    box-shadow: 0 0 0 2px rgba(33, 128, 116, 0.1);
}

.info-textarea {
    min-height: 80px;
    resize: vertical;
}

.info-input:disabled {
    background-color: #f5f5f5;
    cursor: not-allowed;
}

.form-actions {
    display: flex;
    gap: 1rem;
    justify-content: center;
    margin-top: 2rem;
    margin-bottom: 2rem;
}

.submit-button,
.cancel-button {
    padding: 10px 30px;
    border: none;
    border-radius: 9999px;
    font-size: 18px;
    font-weight: 500;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
    transition: opacity 0.2s;
}

.submit-button {
    background-color: rgb(33, 128, 116);
    color: white;
}

.cancel-button {
    background-color: rgba(33, 128, 116, 0.2);
    color: rgb(33, 128, 116);
}

.submit-button:hover,
.cancel-button:hover {
    opacity: 0.9;
}

@media (max-width: 1024px) {
    .info-blocks-container {
        flex-direction: column;
    }
}
</style>

<input type="hidden" id="lat" name="lat">
<input type="hidden" id="lon" name="lon">

{% endblock content %}
