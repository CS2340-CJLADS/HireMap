{% extends 'base.html' %}
{% block content %}
{% load static %}
<link rel="stylesheet" type="text/css" href="{% static 'css/profile.css' %}">

<div class="job-search-container">
    <div class="page-container">
        <div class="dashboard-section">
            <h2>Edit Profile</h2>
            <p>Update your recruiter profile information.</p>
            
            <form method="post" class="profile-form">
                {% csrf_token %}
                
                <!-- Basic Information -->
                <div class="form-section">
                    <h3>Basic Information</h3>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="first_name">First Name</label>
                            <input type="text" id="first_name" name="first_name" value="{{ template_data.recruiter.first_name }}" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="last_name">Last Name</label>
                            <input type="text" id="last_name" name="last_name" value="{{ template_data.recruiter.last_name }}" required>
                        </div>
                    </div>
                </div>
                
                <!-- Company Information -->
                <div class="form-section">
                    <h3>Company Information</h3>
                    <div class="form-group">
                        <label for="company_name">Company Name</label>
                        <input type="text" id="company_name" name="company_name" value="{{ template_data.recruiter.company_name|default:'' }}" placeholder="Your company or organization">
                    </div>
                    
                    <div class="form-group">
                        <label for="location">Location (Legacy)</label>
                        <input type="text" id="location" name="location" value="{{ template_data.recruiter.location|default:'' }}" placeholder="Kept for backward compatibility">
                    </div>
                </div>
                
                <!-- Address Information -->
                <div class="form-section">
                    <h3>Address Information</h3>
                    <div class="form-group">
                        <label for="street_address">Street Address</label>
                        <input type="text" id="street_address" name="street_address" value="{{ template_data.recruiter.street_address|default:'' }}" placeholder="123 Main Street">
                    </div>
                    
                    <div class="form-group">
                        <label for="post_code">Post Code (ZIP)</label>
                        <input type="text" id="post_code" name="post_code" value="{{ template_data.recruiter.post_code|default:'' }}" placeholder="12345">
                    </div>
                    
                    <div class="form-group">
                        <label for="city">City</label>
                        <input type="text" id="city" name="city" value="{{ template_data.recruiter.city|default:'' }}" placeholder="New York">
                    </div>
                    
                    <div class="form-group">
                        <label for="state">State</label>
                        <input type="text" id="state" name="state" value="{{ template_data.recruiter.state|default:'' }}" placeholder="NY">
                    </div>
                    
                    <div class="form-group">
                        <label for="country">Country</label>
                        <input type="text" id="country" name="country" value="{{ template_data.recruiter.country|default:'USA' }}" readonly style="background-color: #f5f5f5;">
                    </div>
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="btn">Save Changes</button>
                    <a href="{% url 'recruiter:profile' %}" class="btn secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>

<style>
.profile-form {
    max-width: 800px;
    margin-top: 2rem;
}

.form-section {
    background: #f8f9fa;
    padding: 2rem;
    border-radius: 8px;
    margin-bottom: 2rem;
}

.form-section h3 {
    margin: 0 0 1.5rem 0;
    color: #333;
    border-bottom: 2px solid #007bff;
    padding-bottom: 0.5rem;
}

.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
}

.form-group {
    margin-bottom: 1.5rem;
}

.form-group label {
    display: block;
    margin-bottom: 0.5rem;
    font-weight: 500;
    color: #333;
}

.form-group input {
    width: 100%;
    padding: 0.75rem;
    border: 1px solid #ddd;
    border-radius: 4px;
    font-size: 1rem;
}

.form-group input:focus {
    outline: none;
    border-color: #007bff;
    box-shadow: 0 0 0 2px rgba(0, 123, 255, 0.25);
}

.form-actions {
    display: flex;
    gap: 1rem;
    margin-top: 2rem;
    padding-top: 2rem;
    border-top: 1px solid #ddd;
}

.btn {
    padding: 0.75rem 1.5rem;
    border: none;
    border-radius: 4px;
    text-decoration: none;
    font-size: 1rem;
    cursor: pointer;
    display: inline-block;
    text-align: center;
}

.btn.primary {
    background: #007bff;
    color: white;
}

.btn.secondary {
    background: #6c757d;
    color: white;
}

.btn:hover {
    opacity: 0.9;
}

@media (max-width: 768px) {
    .form-row {
        grid-template-columns: 1fr;
    }
}
</style>
{% endblock content %}
