{% extends 'base.html' %}
{% block content %}
{% load static %}
<link rel="stylesheet" type="text/css" href="{% static 'css/style.css' %}">
<style>
.auth-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
  padding: 2rem 1rem;
  min-height: 100vh;
}

.auth-header {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.auth-name-banner {
  background-color: rgb(33, 128, 116);
  color: white;
  font-size: 24px;
  font-weight: 500;
  padding: 5px 20px;
  border-radius: 9999px;
  text-align: center;
  margin-top: 0.8rem;
  display: inline-block;
  width: fit-content;
}

.auth-subtitle {
  color: #666;
  text-align: center;
  margin: 1rem 0 0 0;
  font-size: 18px;
}

.auth-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 500px;
  margin-top: 2rem;
}

.auth-button {
  width: 100%;
  padding: 10px 30px;
  background-color: rgb(33, 128, 116);
  color: white;
  border: none;
  border-radius: 9999px;
  font-size: 18px;
  font-weight: 500;
  cursor: pointer;
  transition: opacity 0.2s;
  text-decoration: none;
  display: block;
  text-align: center;
  box-sizing: border-box;
  margin-bottom: 1rem;
}

.auth-button:hover {
  opacity: 0.9;
}

.auth-button-secondary {
  width: 100%;
  padding: 10px 30px;
  background-color: rgba(33, 128, 116, 0.2);
  color: rgb(33, 128, 116);
  border: none;
  border-radius: 9999px;
  font-size: 18px;
  font-weight: 500;
  cursor: pointer;
  transition: opacity 0.2s;
  text-decoration: none;
  display: block;
  text-align: center;
  box-sizing: border-box;
}

.auth-button-secondary:hover {
  opacity: 0.9;
}

@media (max-width: 768px) {
  .auth-container {
    padding: 1rem 0.5rem;
  }
  
  .auth-name-banner {
    font-size: 20px;
    padding: 5px 15px;
  }
  
  .auth-subtitle {
    font-size: 16px;
  }
}
</style>

<div class="auth-container">
  <div class="auth-header">
    <div class="auth-name-banner">HireMap</div>
    <p class="auth-subtitle">Welcome to HireMap</p>
  </div>

  <div class="auth-card">
    <a href="{% url 'accounts:login' %}" class="auth-button">Log In</a>
    <a href="{% url 'accounts:signup' %}" class="auth-button-secondary">Sign Up</a>
  </div>
</div>
{% endblock content %}
