{% extends 'base.html' %}
{% block content %}
{% load static %}
<link rel="stylesheet" type="text/css" href="{% static 'css/jobs.css' %}">
<div class="container">
  <a class="link-back" href="/jobs/">← Back to jobs</a>
  <div class="job-header">
    <h2 class="page-title">Frontend Engineer</h2>
    <div class="job-actions">
      <form method="post" action="{% url 'jobs:detail' job.id %}">
      {% csrf_token %}
        <textarea name="message" placeholder="Optional message to employer"></textarea><br>
        <button type="submit" class="btn">Apply</button>
      </form>
    <button class="btn secondary">Save</button>
    </div>

  </div>
  <div class="grid-2">
    <div class="card">
      <h3>About the role</h3>
      <ul class="list">
        <li>Build accessible UI with React/Leaflet</li>
        <li>Collaborate with backend</li>
        <li>Ship features weekly</li>
      </ul>
    </div>
    <div class="card">
      <h3>Details</h3>
      <p class="small muted">Remote • Full-time • $120k–$150k</p>
    </div>
  </div>
</div>
{% endblock content %}
