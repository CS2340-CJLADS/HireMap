{% extends 'base.html' %}
{% block content %}
{% load static %}
<link rel="stylesheet" type="text/css" href="{% static 'css/style.css' %}">
<style>
.post-job-container {
  max-width: 800px;
  margin: 0 auto;
  padding: 2rem;
}

.form-section {
  margin-bottom: 2rem;
  padding: 1.5rem;
  background: #FFFFFA;
  border: 1px solid #2A5155;
  border-radius: 8px;
}

.form-section h3 {
  color: #2A5155;
  margin-bottom: 1rem;
  font-size: 1.2rem;
  border-bottom: 2px solid #e8f4f4;
  padding-bottom: 0.5rem;
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
  margin-bottom: 1rem;
}

.form-group {
  margin-bottom: 1rem;
}

.form-group label {
  display: block;
  margin-bottom: 0.5rem;
  font-weight: 600;
  color: #2A5155;
}

.form-group input,
.form-group select,
.form-group textarea {
  width: 100%;
  padding: 0.75rem;
  border: 1px solid #2A5155;
  border-radius: 6px;
  background: #FFFFFA;
  font-size: 1rem;
  transition: border-color 0.2s ease;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
  outline: none;
  border-color: #2A5155;
  box-shadow: 0 0 0 3px rgba(42, 81, 85, 0.1);
}

.form-group textarea {
  resize: vertical;
  min-height: 120px;
}

.salary-range {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
}

.work-type-selection {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
  margin: 1rem 0;
}

.work-type-card {
  padding: 1rem;
  border: 2px solid #2A5155;
  border-radius: 8px;
  text-align: center;
  cursor: pointer;
  transition: all 0.3s ease;
}

.work-type-card:hover {
  border-color: #2A5155;
  background: #e8f4f4;
}

.work-type-card.selected {
  border-color: #2A5155;
  background: #e8f4f4;
}

.work-type-card h4 {
  margin: 0 0 0.5rem 0;
  color: #2A5155;
}

.work-type-card p {
  margin: 0;
  color: #666;
  font-size: 0.9rem;
}

.skills-input {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  margin-bottom: 1rem;
}

.skill-tag {
  background: #e8f4f4;
  color: #2A5155;
  padding: 0.5rem 1rem;
  border-radius: 20px;
  font-size: 0.9rem;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.skill-remove {
  background: none;
  border: none;
  color: #2A5155;
  cursor: pointer;
  font-weight: 700;
  padding: 0;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.skill-remove:hover {
  background: rgba(42, 81, 85, 0.1);
}

.skill-input {
  display: flex;
  gap: 0.5rem;
  margin-top: 1rem;
}

.skill-input input {
  flex: 1;
}

.form-actions {
  display: flex;
  gap: 1rem;
  margin-top: 2rem;
  padding-top: 2rem;
  border-top: 1px solid #2A5155;
}

.checkbox-group {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  margin: 1rem 0;
}

.checkbox-group input[type="checkbox"] {
  width: auto;
  margin: 0;
}

.checkbox-group label {
  margin: 0;
  font-weight: normal;
}
</style>

<div class="container">
  <div class="page-head">
    <h2 class="page-title">Post New Job</h2>
    <a class="link-back" href="/manage-jobs/">← Manage Jobs</a>
  </div>

  <div class="post-job-container">
    <form class="form" method="post" id="jobPostForm">
      {% csrf_token %}
      
      <!-- Basic Information Section -->
      <div class="form-section">
        <h3>Basic Information</h3>
        
        <div class="form-group">
          <label for="title">Job Title *</label>
          <input type="text" name="title" id="title" placeholder="e.g., Senior Software Engineer" required>
        </div>
        
        <div class="form-group">
          <label for="company_name">Company Name *</label>
          <input type="text" name="company_name" id="company_name" placeholder="Enter company name" required>
        </div>
        
        <div class="form-group">
          <label for="description">Job Description *</label>
          <textarea name="description" id="description" placeholder="Describe the role, responsibilities, and what you're looking for..." required></textarea>
        </div>
      </div>

      <!-- Location & Work Type Section -->
      <div class="form-section">
        <h3>Location & Work Type</h3>
        
        <div class="form-group">
          <label for="location">Location *</label>
          <input type="text" name="location" id="location" placeholder="e.g., San Francisco, CA or Remote" required>
        </div>
        
        <div class="work-type-selection">
          <div class="work-type-card" onclick="selectWorkType('remote')" id="remote-card">
            <h4>Remote</h4>
            <p>Work from anywhere</p>
          </div>
          <div class="work-type-card" onclick="selectWorkType('onsite')" id="onsite-card">
            <h4>On-Site</h4>
            <p>Office-based work</p>
          </div>
        </div>
        
        <input type="hidden" name="work_type" id="work_type" value="">
      </div>

      <!-- Salary & Benefits Section -->
      <div class="form-section">
        <h3>Salary & Benefits</h3>
        
        <div class="salary-range">
          <div class="form-group">
            <label for="salary_min">Minimum Salary</label>
            <input type="number" name="salary_min" id="salary_min" placeholder="e.g., 80000" min="0">
          </div>
          <div class="form-group">
            <label for="salary_max">Maximum Salary</label>
            <input type="number" name="salary_max" id="salary_max" placeholder="e.g., 120000" min="0">
          </div>
        </div>
        
        <div class="checkbox-group">
          <input type="checkbox" name="visa_sponsorship" id="visa_sponsorship">
          <label for="visa_sponsorship">Visa Sponsorship Available</label>
        </div>
      </div>

      <!-- Skills & Requirements Section -->
      <div class="form-section">
        <h3>Skills & Requirements</h3>
        
        <div class="form-group">
          <label>Required Skills</label>
          <div class="skills-input" id="skills-container">
            <!-- Skills will be added here dynamically -->
          </div>
          <div class="skill-input">
            <input type="text" id="skill-input" placeholder="Add a skill (e.g., Python, JavaScript)">
            <button type="button" class="btn secondary" onclick="addSkill()">Add Skill</button>
          </div>
          <input type="hidden" name="skills" id="skills-hidden" value="">
        </div>
      </div>

      <!-- Form Actions -->
      <div class="form-actions">
        <a href="/manage-jobs/" class="btn secondary">Cancel</a>
        <button type="button" class="btn secondary" onclick="saveDraft()">Save as Draft</button>
        <button type="submit" class="btn">Post Job</button>
      </div>
    </form>
  </div>
</div>

<script>
let selectedWorkType = '';
let skillsList = [];

function selectWorkType(type) {
  selectedWorkType = type;
  document.getElementById('work_type').value = type;
  
  // Update visual selection
  document.querySelectorAll('.work-type-card').forEach(card => {
    card.classList.remove('selected');
  });
  document.getElementById(`${type}-card`).classList.add('selected');
}

function addSkill() {
  const skillInput = document.getElementById('skill-input');
  const skill = skillInput.value.trim();
  
  if (skill && !skillsList.includes(skill)) {
    skillsList.push(skill);
    updateSkillsDisplay();
    skillInput.value = '';
  }
}

function removeSkill(skill) {
  skillsList = skillsList.filter(s => s !== skill);
  updateSkillsDisplay();
}

function updateSkillsDisplay() {
  const container = document.getElementById('skills-container');
  const hiddenInput = document.getElementById('skills-hidden');
  
  container.innerHTML = '';
  
  skillsList.forEach(skill => {
    const skillTag = document.createElement('div');
    skillTag.className = 'skill-tag';
    skillTag.innerHTML = `
      ${skill}
      <button type="button" class="skill-remove" onclick="removeSkill('${skill}')">×</button>
    `;
    container.appendChild(skillTag);
  });
  
  hiddenInput.value = skillsList.join(',');
}

function saveDraft() {
  alert('Draft saved! (Frontend only - backend integration needed)');
}

// Handle form submission
document.getElementById('jobPostForm').addEventListener('submit', function(e) {
  e.preventDefault();
  
  // Validate required fields
  const title = document.getElementById('title').value.trim();
  const company = document.getElementById('company_name').value.trim();
  const description = document.getElementById('description').value.trim();
  const location = document.getElementById('location').value.trim();
  
  if (!title || !company || !description || !location) {
    alert('Please fill in all required fields.');
    return;
  }
  
  if (!selectedWorkType) {
    alert('Please select a work type.');
    return;
  }
  
  // Show success message
  alert('Job posted successfully! (Frontend only - backend integration needed)');
  
  // Redirect back to manage jobs
  window.location.href = '/manage-jobs/';
});

// Allow adding skills with Enter key
document.getElementById('skill-input').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') {
    e.preventDefault();
    addSkill();
  }
});
</script>
{% endblock content %}
