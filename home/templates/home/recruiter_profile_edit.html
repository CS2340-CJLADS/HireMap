{% extends 'base.html' %}
{% block content %}
{% load static %}
<link rel="stylesheet" type="text/css" href="{% static 'css/profile.css' %}">
<div class="container">
  <div class="hero">
    <h1>Edit Profile</h1>
    <p class="lede muted">Update your recruiter information.</p>
    <a href="{% url 'home:recruiter_profile' %}" class="link-back">← Back to Profile</a>
  </div>

  <section class="section">
    <div class="card">
      <form class="form" method="post">
        {% csrf_token %}
        
        <div class="form-group">
          <label class="label">First Name *</label>
          <input type="text" name="first_name" value="{{ template_data.recruiter.first_name }}" required>
        </div>

        <div class="form-group">
          <label class="label">Last Name *</label>
          <input type="text" name="last_name" value="{{ template_data.recruiter.last_name }}" required>
        </div>
        
        <div class="form-group">
          <label class="label">Company Name</label>
          <input type="text" name="company_name" value="{{ template_data.recruiter.company_name }}" placeholder="e.g., Tech Corp Inc.">
        </div>
        
        <div class="form-group">
          <label class="label">Location</label>
          <input type="text" name="location" value="{{ template_data.recruiter.location }}" placeholder="e.g., San Francisco, CA">
        </div>

        <div class="form-actions">
          <button type="submit" class="btn">Save Profile</button>
          <a href="{% url 'home:recruiter_profile' %}" class="btn secondary">Cancel</a>
        </div>
      </form>
    </div>
  </section>
</div>

<style>
.hero {
  text-align: center;
  margin-bottom: 2rem;
  padding: 2rem 0;
  background: linear-gradient(135deg, var(--brand) 0%, var(--brand-dark) 100%);
  color: white;
  border-radius: 8px;
}

.hero h1 {
  margin: 0 0 0.5rem 0;
  font-size: 2.5rem;
  font-weight: 700;
}

.hero .lede {
  margin: 0 0 1rem 0;
  font-size: 1.1rem;
  color: white;
  opacity: 0.9;
}

.link-back {
  color: white;
  text-decoration: none;
  font-weight: 500;
  opacity: 0.9;
  transition: transform 0.3s ease, opacity 0.2s;
  display: inline-block;
}

.link-back:hover {
  color: white;
  opacity: 1;
  transform: scale(1.05);
  text-decoration: none;
}

.section {
  display: grid;
  gap: 1.5rem;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
}

.card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 1.5rem;
  transition: box-shadow 0.2s;
}

.card:hover {
  box-shadow: 0 4px 8px rgba(0,0,0,0.1);
}

.form-group {
  margin-bottom: 1.5rem;
}

.label {
  display: block;
  margin-bottom: 0.5rem;
  font-weight: 600;
  color: var(--brand);
}

.form-group input {
  width: 100%;
  padding: 0.75rem;
  border: 1px solid var(--border);
  border-radius: 4px;
  font-size: 1rem;
  transition: border-color 0.2s;
}

.form-group input:focus {
  outline: none;
  border-color: var(--brand);
  box-shadow: 0 0 0 2px rgba(42, 81, 85, 0.1);
}

.form-actions {
  display: flex;
  gap: 1rem;
  justify-content: center;
  padding-top: 1rem;
  border-top: 1px solid var(--border);
}

.btn {
  display: inline-block;
  padding: 0.75rem 1.5rem;
  background: var(--brand);
  color: white;
  text-decoration: none;
  border-radius: 4px;
  font-weight: 500;
  transition: background-color 0.2s;
  border: none;
  cursor: pointer;
}

.btn:hover {
  background: var(--brand-dark);
  color: white;
  text-decoration: none;
}

.btn.secondary {
  background: white;
  color: #2A5155;
  border: 1px solid #2A5155;
}

.btn.secondary:hover {
  background: #2A5155;
  color: white;
}

@media (max-width: 768px) {
  .hero h1 {
    font-size: 2rem;
  }
  
  .section {
    grid-template-columns: 1fr;
  }
  
  .form-actions {
    flex-direction: column;
  }
}
</style>
{% endblock content %}
